<!doctype html>
<html lang="cs" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backtester investičních portfolií | ÁšHub</title>
  <meta name="description" content="Měsíční simulace ETF portfolií, poplatků, transakčních nákladů, XIRR/TWR a rebalancingu.">
  <script>
    (() => {
      const saved = localStorage.getItem('portfolioBacktesterTheme') || 'auto';
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.bsTheme = saved === 'auto' ? (prefersDark ? 'dark' : 'light') : saved;
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/apps/portfolio-backtester/backtester.css' | relative_url }}?v=20260530-btc">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body class="portfolio-backtester-page">
  <div class="container app-shell">
    <header class="app-header d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-end mb-4">
      <div>
        <a class="back-link" href="{{ '/' | relative_url }}">ÁšHub</a>
        <h1 class="mb-1">Backtester investičních portfolií</h1>
        <div class="subtle">Měsíční simulace ETF portfolií, syntetické testovací instrumenty, poplatky, transakční náklady, XIRR/TWR a rebalancing.</div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button id="themeModeBtn" class="btn btn-outline-secondary btn-sm" type="button">Motiv: auto</button>
      </div>
    </header>

    {% include portfolio-backtester.html %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ '/assets/apps/portfolio-backtester/backtester.js' | relative_url }}?v=20260530-btc"></script>
  <script>
    (() => {
      const button = document.getElementById('themeModeBtn');
      const modes = ['auto', 'light', 'dark'];
      const labels = { auto: 'Motiv: auto', light: 'Motiv: světlý', dark: 'Motiv: tmavý' };
      const apply = mode => {
        localStorage.setItem('portfolioBacktesterTheme', mode);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.bsTheme = mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode;
        button.textContent = labels[mode];
      };
      const current = localStorage.getItem('portfolioBacktesterTheme') || 'auto';
      apply(current);
      button.addEventListener('click', () => {
        const next = modes[(modes.indexOf(localStorage.getItem('portfolioBacktesterTheme') || 'auto') + 1) % modes.length];
        apply(next);
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if ((localStorage.getItem('portfolioBacktesterTheme') || 'auto') === 'auto') apply('auto');
      });
    })();
  </script>
</body>
</html>
